name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun x prisma generate
      - run: bun run lint
      - run: bun run build
      - run: bun run test --runInBand
      - run: bun run test:integration
      - run: bun run test:rmq
      - name: Build production image (no push)
        run: docker build --tag cinema-loyalty-service:ci .
