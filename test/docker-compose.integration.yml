services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loyalty_integration
      POSTGRES_USER: loyalty_test
      POSTGRES_PASSWORD: integration_test
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loyalty_test -d loyalty_integration']
      interval: 1s
      timeout: 3s
      retries: 30
